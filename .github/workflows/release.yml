name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: ""
          - goos: darwin
            goarch: amd64
            suffix: ""
          - goos: darwin
            goarch: arm64
            suffix: ""
          - goos: windows
            goarch: amd64
            suffix: ".exe"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags="-s -w" -o sloppiler-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sloppiler-${{ matrix.goos }}-${{ matrix.goarch }}
          path: sloppiler-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.suffix }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: sloppiler-*
          body: |
            ## Sloppiler ${{ github.ref_name }}

            *Beyond Deterministic Compilation.*

            Download the binary for your platform and point it at a running Ollama instance.
            Output is always a Linux x86_64 ELF. That's not a bug.

            | Platform | Binary |
            |----------|--------|
            | Linux x86_64 | `sloppiler-linux-amd64` |
            | macOS Intel | `sloppiler-darwin-amd64` |
            | macOS Apple Silicon | `sloppiler-darwin-arm64` |
            | Windows x86_64 | `sloppiler-windows-amd64.exe` |
